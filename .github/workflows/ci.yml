name: CI Backend

# Se ejecuta en cada push y en cada pull request hacia main
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # PostgreSQL real para las pruebas de integracion y persistencia
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cineadapt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: cineadapt_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Analisis estatico (ESLint)
        run: npm run lint

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Pruebas de integracion y persistencia (con cobertura)
        run: npm run test:ci

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: coverage/
          if-no-files-found: ignore
